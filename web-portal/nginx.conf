# Static config. The /api/* proxy locations are generated at container start by
# /docker-entrypoint.d/20-quickterm-config.sh into /etc/nginx/api-proxy.conf.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache runtime config so environments can swap URLs freely.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Generated: either reverse-proxy locations for /api/quote/ and /api/policy/,
  # or a comment (browser-direct mode), or a 502 stub explaining a misconfig.
  include /etc/nginx/api-proxy.conf;

  # SPA fallback for client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
