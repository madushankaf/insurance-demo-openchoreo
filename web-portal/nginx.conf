server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache runtime config so environments can swap URLs freely.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # SPA fallback for client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
