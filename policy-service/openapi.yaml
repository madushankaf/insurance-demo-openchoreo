openapi: 3.0.3
info:
  title: Policy Service
  description: Policies, beneficiaries, billing and status for AAA Life QuickTerm.
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/policies:
    get:
      summary: List policies
      operationId: listPolicies
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, ACTIVE, GRACE, LAPSED]
      responses:
        "200":
          description: Matching policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
    post:
      summary: Create a policy from a quote
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: Validation error or invalid/expired quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/policies/{policyId}:
    get:
      summary: Fetch a policy by id
      operationId: getPolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/policies/{policyId}/payments:
    post:
      summary: Record a premium payment
      operationId: makePayment
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment recorded; next due date advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/policies/{policyId}/status:
    patch:
      summary: Update status and append a notice (used by renewal-job)
      description: Idempotent per (dueCycle, type).
      operationId: updateStatus
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Beneficiary:
      type: object
      required:
        - name
        - relationship
        - percentage
      properties:
        name:
          type: string
        relationship:
          type: string
          example: SPOUSE
        percentage:
          type: number
          format: double
          example: 100
    Notice:
      type: object
      properties:
        type:
          type: string
          example: RENEWAL_REMINDER
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        dueCycle:
          type: string
          example: "2026-09-01"
    Applicant:
      type: object
      properties:
        name:
          type: string
        dateOfBirth:
          type: string
        email:
          type: string
    Policy:
      type: object
      properties:
        policyId:
          type: string
          example: "POL-70cf833aedc918c6"
        policyNumber:
          type: string
          example: "AAL-2026-000113"
        applicant:
          $ref: "#/components/schemas/Applicant"
        coverageAmount:
          type: integer
        termYears:
          type: integer
        monthlyPremium:
          type: number
          format: double
        status:
          type: string
          enum: [PENDING, ACTIVE, GRACE, LAPSED]
        effectiveDate:
          type: string
          format: date
        nextPremiumDueDate:
          type: string
          format: date
        lastPaymentDate:
          type: string
        beneficiaries:
          type: array
          items:
            $ref: "#/components/schemas/Beneficiary"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
    CreatePolicyRequest:
      type: object
      required:
        - quoteId
        - applicantEmail
        - effectiveDate
        - beneficiaries
      properties:
        quoteId:
          type: string
        applicantName:
          type: string
        applicantEmail:
          type: string
        effectiveDate:
          type: string
          format: date
        beneficiaries:
          type: array
          items:
            $ref: "#/components/schemas/Beneficiary"
    StatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, ACTIVE, GRACE, LAPSED]
        type:
          type: string
          example: RENEWAL_REMINDER
        message:
          type: string
        dueCycle:
          type: string
          example: "2026-09-01"
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
    Error:
      type: object
      properties:
        error:
          type: string
